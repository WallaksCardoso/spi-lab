services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: spilab
      POSTGRES_USER: spilab
      POSTGRES_PASSWORD: spilab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spilab -d spilab"]
      interval: 5s
      timeout: 3s
      retries: 10
