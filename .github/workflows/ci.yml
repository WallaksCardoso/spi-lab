name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (com PostgreSQL via Testcontainers)
        run: ./mvnw -B -ntp verify
      - name: Imagem Docker
        run: docker build -t spi-lab .
